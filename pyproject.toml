[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "extract-regress"
version = "0.1.0"
description = "pytest for LLM extraction — pin golden extractions and catch silent regressions when the prompt, model, schema, or source format drifts."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mykola Podpriatov" }]
keywords = [
    "pytest",
    "llm",
    "extraction",
    "regression-testing",
    "golden-fixtures",
    "evaluation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5",
    "deepdiff>=6.7",
    "python-dateutil>=2.8",
    "rapidfuzz>=3.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/mykolapodpriatov/extract-regress"
Repository = "https://github.com/mykolapodpriatov/extract-regress"
Issues = "https://github.com/mykolapodpriatov/extract-regress/issues"

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.25"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-python-dateutil>=2.8",
]

[project.scripts]
extract-regress = "extract_regress.cli:app"

[project.entry-points.pytest11]
extract_regress = "extract_regress.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/extract_regress"]

[tool.hatch.build.targets.sdist]
include = ["src/extract_regress", "README.md", "LICENSE"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "B008", # function call in default argument (typer uses this idiom)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["extract_regress"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["deepdiff.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
# The plugin ships its own assertions; disabling auto-load here keeps unit
# tests isolated. The pytester-based tests opt back in explicitly.
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["extract_regress"]
omit = ["*/pytest_plugin.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
