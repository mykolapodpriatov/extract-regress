name: "extract-regress run"
description: >-
  Replay golden extraction fixtures with extract-regress and fail the build on a
  regression, coverage drop, or budget breach. Optionally posts the field-level
  diff as a PR comment.
author: "Mykola Podpriatov"
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  config-module:
    description: "Module or path exposing extract_regress_config()."
    required: false
    default: "conftest.py"
  project-dir:
    description: "Directory to resolve the config and fixtures from."
    required: false
    default: "."
  fixtures-dir:
    description: "Override the fixtures directory (empty = use the config's)."
    required: false
    default: ""
  budget:
    description: "Enforce cost/latency budgets."
    required: false
    default: "true"
  python-version:
    description: "Python version to run on."
    required: false
    default: "3.x"
  comment:
    description: "Post the diff as a PR comment when a token is available."
    required: false
    default: "true"
  github-token:
    description: >-
      Token used to post the PR comment. When empty, the comment step is skipped
      (the check still runs and sets the exit code).
    required: false
    default: ""

outputs:
  passed:
    description: "'true' if no regression was detected, else 'false'."
    value: ${{ steps.check.outputs.passed }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install extract-regress
      shell: bash
      run: python -m pip install --upgrade "extract-regress"

    - name: Run extract-regress
      id: check
      shell: bash
      env:
        ER_CONFIG_MODULE: ${{ inputs.config-module }}
        ER_PROJECT_DIR: ${{ inputs.project-dir }}
        ER_FIXTURES_DIR: ${{ inputs.fixtures-dir }}
        ER_BUDGET: ${{ inputs.budget }}
        ER_COMMENT: ${{ inputs.comment }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: python -m extract_regress.action.entrypoint
